name: Rename pide-tu-termo.html to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Rename file and push to main
        run: |
          git mv pide-tu-termo.html index.html
          git config user.name "magirealtour2023"
          git config user.email "magirealtour2023@users.noreply.github.com"
          git commit -m "Rename pide-tu-termo.html to index.html"
          git push
