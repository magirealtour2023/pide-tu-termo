name: rename-to-index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original file and rename to index.html
        run: |
          git config user.name "magirealtour2023"
          git config user.email "josedavidmihijo@gmail.com"
          git checkout 3997d97 -- pide-tu-termo.html
          git rm -q index.html
          git mv pide-tu-termo.html index.html
          git commit -m "Restore pide-tu-termo.html content as index.html"
          git push
