name: Rename pide-tu-termo.html to index.html

on:
  push:
    paths:
      - '.github/workflows/rename-to-index.yml'

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          if [ -f pide-tu-termo.html ]; then
            mv pide-tu-termo.html index.html
            git config user.name "magirealtour2023"
            git config user.email "magirealtour2023@users.noreply.github.com"
            git add -A
            git commit -m "Rename pide-tu-termo.html to index.html"
            git push
          else
            echo "pide-tu-termo.html not found, nothing to do"
          fi
